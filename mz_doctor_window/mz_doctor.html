<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>医生窗口 - 排队叫号系统</title>
    <link rel="stylesheet" href="doctor.css">
</head>
<body>
    <div class="container">
        <!-- 顶部导航 -->
        <header class="header">
            <div class="header-left">
                <div class="logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                </div>
                <div class="header-title">
                    <h1>医生窗口</h1>
                    <span class="subtitle">排队叫号管理</span>
                </div>
            </div>
            <div class="header-right">
                <a href="../mz_pharmacy/mz_pharmacy.html" class="btn btn-primary" id="pharmacyLink">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <polyline points="10 9 9 9 8 9"/>
                    </svg>
                    取药患者列表
                </a>
                <div class="window-selector">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"/>
                        <rect x="14" y="3" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/>
                    </svg>
                    <select id="windowSelect">
                        <option value="">加载中...</option>
                    </select>
                    <button class="btn btn-primary" id="switchWindowBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="17 1 21 5 17 9"/>
                            <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                            <polyline points="7 23 3 19 7 15"/>
                            <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                        </svg>
                        切换
                    </button>
                </div>
            </div>
        </header>

        <!-- 当前叫号卡片 -->
        <section class="current-call-card">
            <div class="current-call-info">
                <span class="label">当前叫号</span>
                <div class="call-number" id="callNumber">---</div>
                <div class="patient-name" id="patientName">等待叫号</div>
            </div>
            <div class="window-badge" id="windowBadge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                    <circle cx="12" cy="10" r="3"/>
                </svg>
                <span id="windowName">窗口1</span>
            </div>
        </section>

        <!-- 操作按钮 -->
        <section class="action-buttons">
            <button class="action-btn skip-btn" id="skipBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="5 4 15 12 5 20 5 4"/>
                    <line x1="19" y1="5" x2="19" y2="19"/>
                </svg>
                <span>跳过</span>
            </button>
            <button class="action-btn recall-btn" id="recallBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                </svg>
                <span>重呼</span>
            </button>
            <button class="action-btn complete-btn" id="completeBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
                <span>完成</span>
            </button>
        </section>

        <!-- 业务卡片列表 -->
        <section class="business-cards" id="businessCards">
            <div class="loading-state">
                <div class="spinner"></div>
                <span>加载中...</span>
            </div>
        </section>

        <!-- 操作日志 -->
<!--        <section class="log-section">-->
<!--            <div class="section-header">-->
<!--                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">-->
<!--                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>-->
<!--                    <polyline points="14 2 14 8 20 8"/>-->
<!--                    <line x1="16" y1="13" x2="8" y2="13"/>-->
<!--                    <line x1="16" y1="17" x2="8" y2="17"/>-->
<!--                    <polyline points="10 9 9 9 8 9"/>-->
<!--                </svg>-->
<!--                <h2>操作日志</h2>-->
<!--            </div>-->
<!--            <div class="log-list" id="logList">-->
<!--                <div class="log-item">-->
<!--                    <span class="log-time">&#45;&#45;:&#45;&#45;:&#45;&#45;</span>-->
<!--                    <span class="log-text">系统已启动</span>-->
<!--                </div>-->
<!--            </div>-->
<!--        </section>-->
    </div>

    <script src="doctor.js"></script>
</body>
</html>
