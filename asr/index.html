<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医疗语音转写与报告生成系统</title>
    <style>
        /* ===== 全局样式（仅保留与之前一致的样式，新增部分已标注） ===== */
        :root {
            --primary: #1a6fb5;
            --primary-dark: #155a8f;
            --primary-light: #e8f3fb;
            --danger: #d14343;
            --danger-light: #fde8e8;
            --success: #2d8a56;
            --success-light: #e6f4ec;
            --warning: #c0792b;
            --warning-light: #fdf3e7;
            --bg: #f5f6f8;
            --surface: #ffffff;
            --surface-alt: #f9fafb;
            --border: #e2e5ea;
            --border-light: #eef0f3;
            --text: #1a1d23;
            --text-secondary: #5f6570;
            --text-muted: #949aa5;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.07), 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.10), 0 3px 8px rgba(0, 0, 0, 0.06);
            --radius-sm: 6px;
            --radius: 10px;
            --radius-lg: 14px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', 'Monaco', 'PingFang SC', monospace;
            --processing: #0d9488;       /* teal-600（深青色） */
            --processing-light: #f0fdfa; /* teal-50（浅青色背景） */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 15px;
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ===== 头部 ===== */
        .app-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), #2196F3);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            flex-shrink: 0;
        }

        .logo-text {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.01em;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 500;
            white-space: nowrap;
        }

        .header-badge.online {
            background: var(--success-light);
            color: var(--success);
        }

        .header-badge.offline {
            background: var(--danger-light);
            color: var(--danger);
        }

        .header-badge.recording {
            background: var(--danger-light);
            color: var(--danger);
            animation: blink-badge 1s ease-in-out infinite;
        }

        @keyframes blink-badge {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }

        .header-badge .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
        }

        .header-badge.online .dot,
        .header-badge.recording .dot {
            background: var(--success);
            animation: pulse-dot 2s infinite;
        }

        .header-badge.recording .dot {
            background: var(--danger);
        }

        @keyframes pulse-dot {
            0%, 100% { box-shadow: 0 0 0 0 rgba(45, 138, 86, 0.5); }
            50% { box-shadow: 0 0 0 8px rgba(45, 138, 86, 0); }
        }

        .cache-clear-btn {
            font-size: 0.72rem;
            padding: 3px 10px;
            border-radius: 12px;
            border: 1px solid #d0d5db;
            background: #fff;
            color: var(--text-muted);
            cursor: pointer;
            margin-left: 8px;
            transition: all 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .cache-clear-btn:hover {
            background: #fee2e2;
            border-color: #fecaca;
            color: #dc2626;
        }

        /* ===== 主布局 ===== */
        .main-wrapper {
            max-width: 1440px;
            margin: 0 auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .top-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .bottom-row {
            width: 100%;
        }

        .panel {
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            transition: box-shadow var(--transition);
            height: fit-content;
        }

        .panel:hover {
            box-shadow: var(--shadow-lg);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-shrink: 0;
        }

        .panel-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.01em;
        }

        .panel-title .icon {
            width: 28px;
            height: 28px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
        }

        .icon-blue {
            background: var(--primary-light);
            color: var(--primary);
        }

        .icon-green {
            background: var(--success-light);
            color: var(--success);
        }

        .panel-badge {
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .badge-recording {
            background: var(--danger-light);
            color: var(--danger);
            animation: blink-badge 1s ease-in-out infinite;
        }

        .badge-idle {
            background: #f0f1f3;
            color: var(--text-muted);
        }

        .badge-generating {
            background: #fff8e1;
            color: #c79100;
            animation: blink-badge 1.2s ease-in-out infinite;
        }

        /* ===== 语音转写部分（保持不变） ===== */
        .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 100px;
        }

        .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .form-group input,
        .form-group select {
            height: 38px;
            padding: 0 11px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            font-family: inherit;
            color: var(--text);
            background: var(--surface-alt);
            transition: all var(--transition);
            width: 100%;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 111, 181, 0.08);
            background: #fff;
        }

        .form-group input::placeholder {
            color: #c0c5cc;
        }

        .voice-section {
            background: var(--surface-alt);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            border: 2px dashed var(--border);
            transition: all var(--transition);
            position: relative;
            flex-shrink: 0;
        }

        .voice-section.recording {
            border-color: var(--danger);
            background: #fffbfb;
            box-shadow: 0 0 0 6px rgba(209, 67, 67, 0.04);
        }

        .voice-section.recording .voice-hint {
            color: var(--danger);
        }

        .voice-btn-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .voice-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            position: relative;
            z-index: 2;
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 16px rgba(26, 111, 181, 0.3);
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .voice-btn:hover {
            background: var(--primary-dark);
            box-shadow: 0 6px 22px rgba(26, 111, 181, 0.4);
            transform: translateY(-1px);
        }

        .voice-btn:active {
            transform: scale(0.94);
            transition: transform 0.1s;
        }

        .voice-btn.recording {
            background: var(--danger);
            box-shadow: 0 4px 20px rgba(209, 67, 67, 0.4);
            animation: pulse-rec 1.5s ease-in-out infinite;
        }

        .voice-btn.recording:hover {
            background: #b83838;
            box-shadow: 0 6px 26px rgba(209, 67, 67, 0.5);
        }

        @keyframes pulse-rec {
            0%, 100% { box-shadow: 0 4px 20px rgba(209, 67, 67, 0.4), 0 0 0 0 rgba(209, 67, 67, 0.25); }
            50% { box-shadow: 0 4px 20px rgba(209, 67, 67, 0.4), 0 0 0 18px rgba(209, 67, 67, 0); }
        }

        .voice-btn:disabled {
            background: #c8cdd4;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .stop-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            background: var(--danger);
            color: #fff;
            box-shadow: 0 4px 12px rgba(209, 67, 67, 0.3);
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .stop-btn:hover {
            background: #b83838;
            box-shadow: 0 6px 18px rgba(209, 67, 67, 0.4);
            transform: translateY(-1px);
        }

        .stop-btn:active {
            transform: scale(0.94);
            transition: transform 0.1s;
        }

        .stop-btn:disabled {
            background: #c8cdd4;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .voice-ring {
            position: absolute;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 2px solid transparent;
            z-index: 1;
            pointer-events: none;
            transition: all 0.3s;
        }

        .voice-ring.recording {
            border-color: rgba(209, 67, 67, 0.3);
            animation: ring-expand 1.5s ease-out infinite;
        }

        @keyframes ring-expand {
            0% { width: 72px; height: 72px; opacity: 0.7; }
            100% { width: 120px; height: 120px; opacity: 0; }
        }

        .voice-hint {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            font-weight: 500;
            min-height: 20px;
            transition: color var(--transition);
        }

        .voice-timer {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            font-variant-numeric: tabular-nums;
            font-family: var(--font-mono);
            min-height: 24px;
        }

        .voice-live-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-align: center;
            min-height: 22px;
            max-width: 100%;
            word-break: break-word;
            background: #fff;
            padding: 6px 14px;
            border-radius: 16px;
            border: 1px solid var(--border-light);
            transition: all var(--transition);
            max-height: 80px;
            overflow-y: auto;
            position: relative;
        }

        .voice-live-text.active {
            color: var(--text);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 111, 181, 0.05);
        }

        .voice-live-text .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: var(--primary);
            margin-left: 2px;
            animation: cursor-blink 0.8s ease-in-out infinite;
            vertical-align: middle;
        }

        @keyframes cursor-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .transcript-area {
            background: var(--surface-alt);
            border-radius: var(--radius);
            padding: 16px;
            min-height: 200px;
            max-height: 300px;
            overflow-y: auto;
            border: 1.5px solid var(--border);
            font-size: 0.9rem;
            line-height: 1.8;
            white-space: pre-wrap;
            word-wrap: break-word;
            flex: 1;
        }

        .transcript-area .stash {
            color: var(--primary);
            font-weight: 500;
            border-left: 3px solid var(--primary);
            padding-left: 8px;
            margin-left: 4px;
        }

        .transcript-area .final {
            color: var(--text);
        }

        .transcript-area .placeholder {
            color: var(--text-muted);
            text-align: center;
            padding: 40px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .text-editor-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 120px;
        }

        .text-editor-area label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .text-editor-area textarea {
            flex: 1;
            min-height: 100px;
            padding: 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            font-size: 0.9rem;
            font-family: inherit;
            color: var(--text);
            background: var(--surface-alt);
            resize: vertical;
            line-height: 1.7;
            outline: none;
            transition: all var(--transition);
            width: 100%;
        }

        .text-editor-area textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 111, 181, 0.08);
            background: #fff;
        }

        .text-editor-area textarea::placeholder {
            color: #c0c5cc;
        }

        .textarea-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 18px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 600;
            border: 1.5px solid transparent;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            white-space: nowrap;
            letter-spacing: 0.01em;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.96);
            transition: transform 0.08s;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 2px 6px rgba(26, 111, 181, 0.2);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
            box-shadow: 0 4px 12px rgba(26, 111, 181, 0.3);
        }

        .btn-primary:disabled {
            background: #a3c8e6;
            border-color: #a3c8e6;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-outline {
            background: #fff;
            color: var(--text);
            border-color: var(--border);
        }

        .btn-outline:hover {
            background: var(--surface-alt);
            border-color: #c5c9d0;
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border-color: transparent;
            padding: 6px 10px;
        }

        .btn-ghost:hover {
            background: #f0f1f3;
            color: var(--text);
        }

        .btn-lg {
            padding: 12px 24px;
            font-size: 0.95rem;
            border-radius: var(--radius);
        }

        .btn-sm {
            padding: 5px 12px;
            font-size: 0.78rem;
            border-radius: 4px;
        }

        .stats {
            display: flex;
            gap: 24px;
            padding-top: 12px;
            border-top: 1px solid var(--border-light);
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .stats span {
            font-weight: 600;
            color: var(--text-secondary);
        }

        .error-msg {
            background: var(--danger-light);
            color: var(--danger);
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 12px;
            display: none;
            font-size: 0.85rem;
        }

        .error-msg.show {
            display: block;
        }

        /* ===== 报告生成部分（新增样式） ===== */
        .patient-card {
            background: var(--surface-alt);
            border-radius: var(--radius);
            padding: 16px;
            border: 1px solid var(--border-light);
            margin: 8px 0;
        }
        .patient-card .row {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .patient-card .label {
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-right: 4px;
        }
        .patient-card .value {
            font-weight: 500;
        }
        .check-items {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
        }
        .check-item-wrapper {
            background: #fff;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            font-size: 0.8rem;
            line-height: 1.5;
            width: 100%;
        }
        .check-item-wrapper:hover {
            border-color: var(--primary);
        }
        .check-item-wrapper.selected {
            border-color: var(--primary);
            background: var(--primary-light);
        }
        .check-item-wrapper .item-name {
            font-weight: 600;
            margin-bottom: 2px;
        }
        .check-item-wrapper .item-meta {
            color: var(--text-muted);
            font-size: 0.7rem;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        /* ===== 历史报告模块（全宽） ===== */
        .report-list {
            width: 100%;
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            padding: 24px;
            margin-top: 0;
        }
        .report-list .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .report-list .header h3 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
        }

        .report-list table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
            table-layout: fixed;
        }
        .report-list th {
            text-align: left;
            padding: 6px 4px;
            border-bottom: 2px solid var(--border);
            color: var(--text-secondary);
            font-weight: 600;
            white-space: nowrap;
        }
        .report-list td {
            padding: 6px 4px;
            border-bottom: 1px solid var(--border-light);
            vertical-align: middle;
            word-break: break-word;
        }
        /* 列宽分配（共10列） */
        .report-list th:nth-child(1), .report-list td:nth-child(1) { width: 8%; }  /* 住院号 */
        .report-list th:nth-child(2), .report-list td:nth-child(2) { width: 6%; }  /* 姓名 */
        .report-list th:nth-child(3), .report-list td:nth-child(3) { width: 5%; }  /* 性别 */
        .report-list th:nth-child(4), .report-list td:nth-child(4) { width: 5%; }  /* 年龄 */
        .report-list th:nth-child(5), .report-list td:nth-child(5) { width: 12%; } /* 检查项目 */
        .report-list th:nth-child(6), .report-list td:nth-child(6) { width: 10%; } /* 提交时间 */
        .report-list th:nth-child(7), .report-list td:nth-child(7) { width: 10%; }  /* 状态 */
        .report-list th:nth-child(8), .report-list td:nth-child(8) { width: 8%; }  /* 患者信息 */
        .report-list th:nth-child(9), .report-list td:nth-child(9) { width: 8%; }  /* 指标数据 */
        .report-list th:nth-child(10), .report-list td:nth-child(10) { width: 8%; }  /* 指标文本 */
        .report-list th:nth-child(11), .report-list td:nth-child(11) { width: 10%; } /* 操作 */

        .report-list .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.65rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .status-badge.generated {
            background: var(--success-light);
            color: var(--success);
        }
        .status-badge.pending {
            background: var(--warning-light);
            color: var(--warning);
        }
        .status-badge.processing {
            background: var(--processing-light);
            color: var(--processing);

    <!-- ============================================================ -->
    <!-- ===== JavaScript ===== -->
    <script>
        (function() {
            // =========================================================
            // 第一部分：左侧语音转写功能（完整保留）
            // =========================================================
            function getApiConfig() {
                const host = window.location.hostname;
                const portMap = {
                    'oa.nsyy.com.cn': 6080,
                    '192.168.3.12':   6083,
                    '192.168.124.9':  8081,
                    '127.0.0.1':      8081,
                    'localhost':      8081,
                };
                let port = portMap[host] || 8081;
                if (host === 'oa.nsyy.com.cn') {
                    return {
                        apiBase: `https://${host}:6081/mz`,
                        wsUrl: `wss://${host}:6081/mz`
                    };
                }
                if (host === '192.168.3.12') {
                    return {
                        apiBase: `https://${host}:6083/mz`,
                        wsUrl: `wss://${host}:6083/mz`
                    };
                }
                return {
                    apiBase: `http://${host}:${port}/mz`,
                    wsUrl: `ws://${host}:${port}/mz`
                };
            }
            const config = getApiConfig();
            const API_BASE = config.apiBase;
            const WS_URL = config.wsUrl;

            // ---- DOM 元素 ----
            const $ = (sel) => document.querySelector(sel);
            const startBtn = $('#startBtn');
            const stopBtn = $('#stopBtn');
            const voiceRing = $('#voiceRing');
            const voiceSection = $('#voiceSection');
            const voiceTimer = $('#voiceTimer');
            const voiceHint = $('#voiceHint');
            const voiceLiveText = $('#voiceLiveText');
            const recordingBadge = $('#recordingBadge');
            const wsStatusBadge = $('#wsStatusBadge');
            const voiceStatusBadge = $('#voiceStatusBadge');
            const transcriptArea = $('#transcriptArea');
            const placeholder = $('#placeholder');
            const errorMsg = $('#errorMsg');
            const btnClear = $('#btnClear');
            const btnCopy = $('#btnCopy');
            const wordCountEl = $('#wordCount');
            const sentenceCountEl = $('#sentenceCount');
            const examFindingsTextarea = $('#examFindings');

            // ---- 状态 ----
            let ws = null;
            let mediaStream = null;
            let audioContext = null;
            let source = null;
            let processor = null;
            let isRecording = false;
            let isConnected = false;
            let fullText = '';
            let currentStash = '';
            let sentenceCountVal = 0;
            let heartbeatInterval = null;
            let connectionStatus = 'disconnected';
            const SAMPLE_RATE = 16000;
            const CHUNK_SIZE = 4096;

            // ---- 本地暂存 ----
            const STORAGE_KEY = 'medical_asr_report_draft';
            function saveDraft() {
                const draft = { examFindings: examFindingsTextarea.value, updatedAt: Date.now() };
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(draft)); } catch(e) {}
            }
            function loadDraft() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return false;
                    const draft = JSON.parse(raw);
                    if (draft.examFindings) {
                        examFindingsTextarea.value = draft.examFindings;
                        fullText = draft.examFindings;
                        updateTranscript();
                        updateWordCount();
                    }
                    return true;
                } catch(e) { return false; }
            }
            function clearDraft() { localStorage.removeItem(STORAGE_KEY); }
            let saveTimeout;
            function debouncedSave() {
                clearTimeout(saveTimeout);
                saveTimeout = setTimeout(saveDraft, 300);
            }
            examFindingsTextarea.addEventListener('input', debouncedSave);
            $('#clearCacheBtn').addEventListener('click', function() {
                if (confirm('确定清除所有本地暂存数据吗？')) {
                    clearDraft();
                    examFindingsTextarea.value = '';
                    fullText = '';
                    currentStash = '';
                    sentenceCountVal = 0;
                    updateTranscript();
                    updateWordCount();
                    sentenceCountEl.textContent = '0';
                    showToast('暂存数据已清除', 'info');
                }
            });

            // ---- Toast（共用） ----
            function showToast(message, type = 'info') {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = 'toast ' + type;
                const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
                toast.textContent = (icons[type] || '') + ' ' + message;
                container.appendChild(toast);
                setTimeout(() => {
                    if (toast.parentNode) {
                        toast.classList.add('removing');
                        toast.addEventListener('animationend', () => toast.remove());
                    }
                }, 3000);
            }

            // ---- 连接管理 ----
            function setConnectionStatus(status) {
                connectionStatus = status;
                const badge = wsStatusBadge;
                badge.className = 'header-badge';
                if (status === 'connected') {
                    badge.classList.add('online');
                    badge.innerHTML = '<span class="dot"></span> 服务已连接';
                    voiceHint.textContent = '点击麦克风开始语音录入';
                    voiceHint.style.color = '';
                } else if (status === 'connecting') {
                    badge.classList.add('online');
                    badge.innerHTML = '<span class="dot"></span> 连接中...';
                    voiceHint.textContent = '正在连接语音服务，请稍候...';
                    voiceHint.style.color = 'var(--text-secondary)';
                } else {
                    badge.classList.add('offline');
                    badge.innerHTML = '<span class="dot"></span> 未连接';
                    voiceHint.textContent = '未连接，点击麦克风建立连接';
                    voiceHint.style.color = 'var(--danger)';
                }
            }

            async function connect() {
                if (isConnected || connectionStatus === 'connecting') return;
                setConnectionStatus('connecting');
                const wsUrl = `${WS_URL}/asr/ws/transcribe`;
                try {
                    ws = new WebSocket(wsUrl);
                    ws.onopen = () => {
                        isConnected = true;
                        setConnectionStatus('connected');
                        startBtn.disabled = false;
                        stopBtn.disabled = true;
                        showError('');
                        console.log('WebSocket 连接成功');
                    };
                    ws.onmessage = (event) => { handleMessage(event.data); };
                    ws.onclose = () => {
                        isConnected = false;
                        setConnectionStatus('disconnected');
                        startBtn.disabled = false;
                        stopBtn.disabled = true;
                        if (isRecording) stopRecording();
                        showToast('语音服务连接已断开，请点击麦克风重新连接', 'warning');
                    };
                    ws.onerror = (error) => {
                        console.error('WebSocket 错误:', error);
                        setConnectionStatus('disconnected');
                        showError('WebSocket 连接错误，请检查网络');
                        showToast('连接失败，请刷新页面或稍后重试', 'error');
                    };
                } catch (err) {
                    console.error('连接失败:', err);
                    setConnectionStatus('disconnected');
                    showToast('连接失败：' + err.message, 'error');
                }
            }

            // ---- 消息处理 ----
            function handleMessage(rawData) {
                try {
                    const data = JSON.parse(rawData);
                    const type = data.type;
                    switch (type) {
                        case 'stash':
                            const delta = data.text || '';
                            if (delta) {
                                currentStash += delta;
                                updateLiveTextWithTyping(currentStash);
                                updateTranscript();
                                updateWordCount();
                            }
                            break;
                        case 'final':
                            const text = data.text || '';

                                currentStash = '';

                                scrollToBottom();
                                examFindingsTextarea.value = fullText;
                                saveDraft();
                                voiceLiveText.innerHTML = '';

                            }
                            break;
                        case 'speech_start':
                            setRecordingUI(true);
                            recordingBadge.textContent = '录音中...';

                            voiceStatusBadge.className = 'header-badge recording';

                            voiceStatusBadge.className = 'header-badge online';
                            voiceStatusBadge.innerHTML = '<span class="dot"></span> 语音就绪';
                            break;
                        case 'error':
                            const errText = data.text || 'ASR 服务错误';
                            if (errText.includes('180')) {
                                showError('超180秒没有语音输入，连接已断开，请重新点击麦克风使用');

                                if (ws && ws.readyState === WebSocket.OPEN) {
                                    ws.close(1000, '空闲超时');
                                }
                            }
                            break;
                        case 'pong': break;
                    }
                } catch (err) {
                    console.error('解析消息失败:', err);
                }

            // ---- 录音核心 ----
            async function startRecording() {
                if (isRecording) return;
                const isWsAlive = isConnected && ws && ws.readyState === WebSocket.OPEN;
                if (!isWsAlive) {
                    if (ws) { try { ws.close(); } catch(e) {} ws = null; }
                    isConnected = false;
                    setConnectionStatus('disconnected');
                    await connect();
                    let waitCount = 0;
                    while (!isConnected && waitCount < 30) {
                        await new Promise(resolve => setTimeout(resolve, 100));
                        waitCount++;
                    }
                    if (!isConnected) {
                        showToast('❌ 无法连接语音服务，请稍后重试', 'error');
                        return;
                    }
                }
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({
                        audio: { sampleRate: SAMPLE_RATE, channelCount: 1, echoCancellation: true, noiseSuppression: true }
                    });
                    audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SAMPLE_RATE });
                    const audioSource = audioContext.createMediaStreamSource(mediaStream);
                    const audioProcessor = audioContext.createScriptProcessor(CHUNK_SIZE, 1, 1);
                    audioSource.connect(audioProcessor);
                    audioProcessor.connect(audioContext.destination);

                    isRecording = true;
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    setRecordingUI(true);
                    voiceStatusBadge.className = 'header-badge recording';
                    voiceStatusBadge.innerHTML = '<span class="dot"></span> 录音中';

                    audioProcessor.onaudioprocess = (e) => {
                        if (!isRecording || !isConnected) return;
                        const inputData = e.inputBuffer.getChannelData(0);
                        const pcmData = float32ToInt16(inputData);
                        const base64Data = arrayBufferToBase64(pcmData);
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ type: 'audio', data: base64Data }));
                        }
                    };
                    processor = audioProcessor;
                    source = audioSource;
                    console.log('🎤 开始录音');
                    startTimer();
                    heartbeatInterval = setInterval(() => {
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ type: 'ping' }));
                        }
                    }, 15000);
                } catch (err) {
                    console.error('启动录音失败:', err);
                    showError('麦克风启动失败: ' + err.message);
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                    setRecordingUI(false);
                    isRecording = false;
                }
            }

            async function stopRecording() {
                if (!isRecording) return;
                isRecording = false;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                setRecordingUI(false);
                voiceStatusBadge.className = 'header-badge online';
                voiceStatusBadge.innerHTML = '<span class="dot"></span> 语音就绪';
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'commit' }));
                }
                if (processor) { processor.disconnect(); processor = null; }
                if (source) { source.disconnect(); source = null; }
                if (audioContext) { await audioContext.close(); audioContext = null; }
                if (mediaStream) { mediaStream.getTracks().forEach(track => track.stop()); mediaStream = null; }
                console.log('⏹️ 停止录音');
                stopTimer();
                recordingBadge.textContent = '录入完成';
                recordingBadge.className = 'panel-badge badge-idle';
                if (heartbeatInterval) { clearInterval(heartbeatInterval); heartbeatInterval = null; }
            }

            function stopTimer() {
                if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

            function updateTimerDisplay() {
                if (!recordingStartTime) return;
                const elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);

            }

            // ---- 音频工具 ----
            function float32ToInt16(float32Array) {
                const int16Array = new Int16Array(float32Array.length);
                for (let i = 0; i < float32Array.length; i++) {
                    const s = Math.max(-1, Math.min(1, float32Array[i]));
                    int16Array[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }
                return int16Array;
            }
            function arrayBufferToBase64(buffer) {
                const bytes = new Uint8Array(buffer.buffer);
                let binary = '';
                for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
                return btoa(binary);
            }

                        const resp = await fetch(`${API_BASE}/asr/patient_pacs_info/${zhuyuanhao}`);
                        if (!resp.ok) throw new Error('患者信息查询失败');
                        const data = await resp.json();
                        currentPatient = data;
                        displayPatientInfo(data);
                        const items = data.check_items_list || [];
                        if (items.length === 1) {
                            selectedCheckItem = items[0].check_item;
                            selectedYizhuid = items[0].yizhuid;
                            highlightCheckItem(selectedCheckItem);
                        } else {
                            selectedCheckItem = null;
                            selectedYizhuid = null;
                        }
                        updateSubmitButton();
                    } catch (err) {
                        showToastPacs('查询失败：' + err.message, 'error');
                        patientInfoArea.style.display = 'none';
                        currentPatient = null;
                        updateSubmitButton();
                    } finally {
                        showLoading(false);
                    }
                }

                function displayPatientInfo(data) {
                    pName.textContent = data.patient_name || '-';
                    pSex.textContent = data.patient_sex || '-';
                    pAge.textContent = data.patient_age || '-';
                    pDept.textContent = data.dept_name || '-';
                    patientInfoArea.style.display = 'block';

                    const items = data.check_items_list || [];
                    checkItemsContainer.innerHTML = '';
                    if (items.length === 0) {
                        checkItemsContainer.innerHTML = '<span style="color:var(--text-muted);">无检查项目</span>';
                        return;
                    }
                    items.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'check-item-wrapper';
                        div.innerHTML = `
                            <div class="item-name">${escapeHtml(item.check_item)}  -  ${escapeHtml(item.kaishisj)}</div>
                            <div class="item-meta">
                                <span>医嘱ID: ${escapeHtml(item.yizhuid)}</span>
                                <span>开嘱: ${escapeHtml(item.kaizhusj)}</span>
                                <span>开始: ${escapeHtml(item.kaishisj)}</span>
                                <span>类型: ${escapeHtml(item.jianchabzfl)}</span>
                            </div>
                        `;
                        div.dataset.value = item.check_item;
                        div.dataset.yizhuid = item.yizhuid;
                        div.addEventListener('click', function() {
                            if (this.classList.contains('disabled')) return;
                            document.querySelectorAll('.check-item-wrapper').forEach(el => el.classList.remove('selected'));
                            this.classList.add('selected');
                            selectedCheckItem = this.dataset.value;
                            console.log(this.dataset)
                            selectedYizhuid = this.dataset.yizhuid;   // 新增
                            updateSubmitButton();
                        });
                        checkItemsContainer.appendChild(div);
                    });
                    // 如果只有一个项目，自动选中
                    if (items.length === 1) {
                        const first = checkItemsContainer.querySelector('.check-item-wrapper');
                        if (first) {
                            first.classList.add('selected');
                            selectedCheckItem = first.dataset.value;
                            selectedYizhuid = first.dataset.yizhuid;   // 新增
                        }
                    }
                }


                function highlightCheckItem(item) {
                    document.querySelectorAll('.check-item-wrapper').forEach(el => {
                        el.classList.toggle('selected', el.dataset.value === item);
                    });
                }

                function updateSubmitButton() {
                    const hasPatient = currentPatient !== null;
                    const hasItem = selectedCheckItem !== null;
                    const hasFindings = document.getElementById('examFindings').value.trim().length > 0;
                    submitBtn.disabled = !(hasPatient && hasItem && hasFindings);
                }

                // ---- 提交报告 ----
                async function submitReport() {
                    if (submitBtn.disabled) return;
                    const examFindings = document.getElementById('examFindings').value.trim();
                    console.log(currentPatient)
                    const data = {
                        zhuyuanhao: currentPatient.zhuyuanhao,
                        patient_name: currentPatient.patient_name,
                        patient_age: currentPatient.patient_age,
                        patient_sex: currentPatient.patient_sex,
                        dept_id: currentPatient.dept_id,
                        dept_name: currentPatient.dept_name,
                        yizhiid: currentPatient.yizhiid,
                        check_items: selectedCheckItem,
                        yizhuid: selectedYizhuid,          // 新增字段
                        patient_info: examFindings
                    };
                    showLoading(true);
                    submitBtn.disabled = true;
                    try {
                        const resp = await fetch(`${API_BASE}/asr/pacs-submit`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(data)
                        });
                        if (!resp.ok) throw new Error(`提交失败 ${resp.status}: ${resp.statusText}`);
                        const result = await resp.json();
                        if (result.success === false) {
                            throw new Error(result.message || '提交失败，请检查数据');
                        }
                        showToastPacs('提交成功，报告生成中...', 'success');
                        document.getElementById('examFindings').value = '';

                        // ===== 清空暂存区（新增） =====
                        fullText = '';
                        currentStash = '';
                        sentenceCountVal = 0;
                        sentenceCountEl.textContent = '0';
                        updateTranscript();
                        updateWordCount();
                        clearDraft();
                        // =============================

                        loadReports(currentPage);
                        updateSubmitButton();
                    } catch (err) {
                        showToastPacs('提交失败：' + err.message, 'error');
                    } finally {
                        showLoading(false);
                        submitBtn.disabled = false;
                        updateSubmitButton();
                    }
                }

                // ---- 历史报告列表 ----
                async function loadReports(page = 1) {
                    showLoading(true);
                    try {
                        const url = `${API_BASE}/asr/pacs_ai_reports?page=${page}&page_size=${PAGE_SIZE}`;
                        const resp = await fetch(url);
                        if (!resp.ok) throw new Error('获取列表失败');
                        const result = await resp.json();
                        const data = result.data || [];
                        const total = result.total || 0;
                        renderTable(data);
                        renderPagination(page, total);
                        showToastPacs('列表已刷新', 'info');
                    } catch (err) {
                        showToastPacs('加载列表失败：' + err.message, 'error');
                    } finally {
                        showLoading(false);
                    }
                }

                function renderTable(data) {
                    if (!data || data.length === 0) {
                        reportTableBody.innerHTML = `<tr><td colspan="11" style="text-align:center; color:var(--text-muted);">暂无记录</td></tr>`;
                        return;
                    }

                    // 新增：存储当前表格数据源，供按钮点击时使用
                    window._reportTableData = data;

                    let html = '';
                    data.forEach((item, index) => {
                        const statusText = item.report_status === 1 ? '报告已生成' : (item.indicator_status === 1 ? '指标完善,报告生成中' : '指标不完善,请补充');
                        const statusClass = item.report_status === 1 ? 'generated' : (item.indicator_status === 1 ? 'processing' : 'pending');
                        const btnDisabled = item.report_status !== 1;

                        const patientInfo = item.patient_info || '暂无';
                        const indicatorData = item.indicator_data || '暂无';

                        // 注意：这里不再把内容放在属性中，而是使用 data-index
                        html += `<tr>
                            <td>${item.zhuyuanhao || '-'}</td>
                            <td>${item.patient_name || '-'}</td>
                            <td>${item.patient_sex || '-'}</td>
                            <td>${item.patient_age || '-'}</td>
                            <td>${item.check_items || '-'}</td>
                            <td>${item.submit_time || '-'}</td>
                            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                            <td>
                                <button class="btn-detail edit-field" data-index="${index}" data-field="patient_info">✏️ 查看/编辑</button>
                            </td>
                            <td>
                                <button class="btn-detail edit-field" data-index="${index}" data-field="indicator_data">✏️ 查看/编辑</button>
                            </td>
                            <td>   <!-- 新增列 -->
                                <button class="btn-detail edit-field-text" data-index="${index}" data-field="indicator_data">📝 文本编辑</button>
                            </td>
                            <td>
                                <button class="btn-view" data-id="${item.id}" ${btnDisabled ? 'disabled' : ''}>
                                    ${btnDisabled ? '⏳ 生成中' : '📄 查看报告'}
                                </button>
                            </td>
                        </tr>`;
                    });
                    reportTableBody.innerHTML = html;

                    // 绑定“查看/编辑”按钮：从 window._reportTableData 获取内容
                    reportTableBody.querySelectorAll('.edit-field').forEach(btn => {
                        btn.addEventListener('click', function() {
                            const index = parseInt(this.dataset.index);
                            const field = this.dataset.field;
                            const record = window._reportTableData[index];
                            if (!record) {
                                showToastPacs('数据不存在', 'error');
                                return;
                            }
                            const content = record[field] || '暂无';
                            const label = field === 'patient_info' ? '患者信息' : '指标数据';
                            openModal(`📋 ${label}（可编辑）`, content, true, record.id, field);
                        });
                    });

                    // 新增的“文本指标”按钮绑定（openModal2）
                    reportTableBody.querySelectorAll('.edit-field-text').forEach(btn => {
                        btn.addEventListener('click', function() {
                            const index = parseInt(this.dataset.index);
                            const record = window._reportTableData[index];
                            if (!record) { showToastPacs('数据不存在', 'error'); return; }
                            const content = record.indicator_data || '暂无';
                            // 调用 openModal2，假设它是一个纯文本编辑器（类似 patient_info 的编辑方式）
                            openModal2('📋 指标数据（文本编辑）', content, true, record.id, 'indicator_data');
                        });
                    });


                    // 绑定查看报告按钮
                    reportTableBody.querySelectorAll('.btn-view:not([disabled])').forEach(btn => {
                        btn.addEventListener('click', function() {
                            const id = this.dataset.id;
                            viewReport(id);
                        });
                    });
                }


                function renderTable1(data) {
                    if (!data || data.length === 0) {
                        reportTableBody.innerHTML = `<tr><td colspan="10" style="text-align:center; color:var(--text-muted);">暂无记录</td></tr>`;
                        return;
                    }
                    let html = '';
                    data.forEach(item => {
                        // const statusText = item.report_status === 1 ? '已生成' : '生成中';
                        const statusText = item.report_status === 1 ? '报告已生成' : (item.indicator_status === 1 ? '指标完善,报告生成中' : '指标不完善,请补充');
                        const statusClass = item.report_status === 1 ? 'generated' : (item.indicator_status === 1 ? 'processing' : 'pending');
                        const btnDisabled = item.report_status !== 1;

                        const patientInfo = item.patient_info || '暂无';
                        const indicatorData = item.indicator_data || '暂无';

                        html += `<tr>
                            <td>${item.zhuyuanhao || '-'}</td>
                            <td>${item.patient_name || '-'}</td>
                            <td>${item.patient_sex || '-'}</td>
                            <td>${item.patient_age || '-'}</td>
                            <td>${item.check_items || '-'}</td>
                            <td>${item.submit_time || '-'}</td>
                            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                            <td>
                                <button class="btn-detail edit-field" data-id="${item.id}" data-field="patient_info" data-content="${escapeHtml(patientInfo)}">✏️ 查看/编辑</button>
                                // 患者信息按钮
                                //<button class="btn-detail edit-field" data-id="${item.id}" data-field="patient_info" data-content-json='${JSON.stringify(patientInfo)}'>✏️ 查看/编辑</button>
                            </td>
                            <td>
                                <button class="btn-detail edit-field" data-id="${item.id}" data-field="indicator_data" data-content="${escapeHtml(indicatorData)}">✏️ 查看/编辑</button>
                                // 指标数据按钮
                                // <button class="btn-detail edit-field" data-id="${item.id}" data-field="indicator_data" data-content-json='${JSON.stringify(indicatorData)}'>✏️ 查看/编辑</button>
                            </td>
                            <td>
                                <button class="btn-view" data-id="${item.id}" ${btnDisabled ? 'disabled' : ''}>
                                    ${btnDisabled ? '⏳ 生成中' : '📄 查看报告'}
                                </button>
                            </td>
                        </tr>`;
                    });
                    reportTableBody.innerHTML = html;

                    // 绑定“查看/编辑”按钮（患者信息和指标数据均支持编辑）
                    reportTableBody.querySelectorAll('.edit-field').forEach(btn => {
                        btn.addEventListener('click', function() {
                            const content = this.dataset.content;
                            // const content = JSON.parse(this.dataset.contentJson || '""');
                            const id = this.dataset.id;
                            const field = this.dataset.field;
                            const label = field === 'patient_info' ? '患者信息' : '指标数据';
                            openModal(`📋 ${label}（可编辑）`, content, true, id, field);
                        });
                    });

                    // 绑定查看报告按钮
                    reportTableBody.querySelectorAll('.btn-view:not([disabled])').forEach(btn => {
                        btn.addEventListener('click', function() {
                            const id = this.dataset.id;
                            viewReport(id);
                        });
                    });
                }

                function renderPagination(current, total) {
                    const totalPages = Math.ceil(total / PAGE_SIZE);
                    if (totalPages <= 1) { paginationControls.innerHTML = ''; return; }
                    let html = '';
                    html += `<button ${current <= 1 ? 'disabled' : ''} data-page="${current-1}">◀</button>`;
                    for (let i = 1; i <= totalPages; i++) {
                        html += `<button class="${i === current ? 'active' : ''}" data-page="${i}">${i}</button>`;
                    }
                    html += `<button ${current >= totalPages ? 'disabled' : ''} data-page="${current+1}">▶</button>`;
                    paginationControls.innerHTML = html;
                    paginationControls.querySelectorAll('button[data-page]').forEach(btn => {
                        btn.addEventListener('click', function() {
                            const page = parseInt(this.dataset.page);
                            if (!isNaN(page) && page >= 1 && page <= totalPages) {
                                currentPage = page;
                                loadReports(page);
                            }
                        });
                    });
                }

                // ---- 查看报告 ----
                async function viewReport(reportId) {
                    showLoading(true);
                    try {
                        const resp = await fetch(`${API_BASE}/asr/pacs_ai_report/${reportId}`);
                        if (!resp.ok) throw new Error('获取报告失败');
                        const data = await resp.json();
                        let content = '暂无报告内容';
                        if (data.report) {
                            if (typeof data.report === 'string') content = data.report;
                            else if (data.report.ai_report) content = data.report.ai_report;
                            else if (data.report.report) content = data.report.report;
                            else if (data.report.content) content = data.report.content;
                            else content = JSON.stringify(data.report, null, 2);
                        } else if (data.ai_report) {
                            content = data.ai_report;
                        } else if (data.content) {
                            content = data.content;
                        } else {
                            content = JSON.stringify(data, null, 2);
                        }
                        openModal('📄 报告详情', content, false);
                    } catch (err) {
                        showToastPacs('查看报告失败：' + err.message, 'error');
                    } finally {
                        showLoading(false);
                    }
                }

                // ---- 模态框关闭 ----
                modalCloseBtn.addEventListener('click', () => modalOverlay.classList.remove('active'));
                modalOverlay.addEventListener('click', (e) => {
                    if (e.target === modalOverlay) modalOverlay.classList.remove('active');
                });

                // ---- 事件绑定 ----
                queryBtn.addEventListener('click', queryPatient);
                zhuyuanhaoInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') queryPatient(); });
                submitBtn.addEventListener('click', submitReport);
                refreshListBtn.addEventListener('click', () => loadReports(currentPage));
                document.getElementById('examFindings').addEventListener('input', updateSubmitButton);

                // ---- 初始化 ----
                loadReports(1);
                submitBtn.disabled = true;
                console.log('报告模块初始化完成');
            })();
        })();
    </script>
</body>
</html>
