<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>医疗语音转写与报告生成系统</title>
    <style>
        /* ===== 全局样式 ===== */
        :root {
            --primary: #1a6fb5;
            --primary-dark: #155a8f;
            --primary-light: #e8f3fb;
            --danger: #d14343;
            --danger-light: #fde8e8;
            --success: #2d8a56;
            --success-light: #e6f4ec;
            --warning: #c0792b;
            --warning-light: #fdf3e7;
            --bg: #f5f6f8;
            --surface: #ffffff;
            --surface-alt: #f9fafb;
            --border: #e2e5ea;
            --border-light: #eef0f3;
            --text: #1a1d23;
            --text-secondary: #5f6570;
            --text-muted: #949aa5;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.07), 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.10), 0 3px 8px rgba(0, 0, 0, 0.06);
            --radius-sm: 6px;
            --radius: 10px;
            --radius-lg: 14px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', 'Monaco', 'PingFang SC', monospace;
            --processing: #0d9488;
            --processing-light: #f0fdfa;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            font-size: 15px;
            scroll-behavior: smooth;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== 头部 ===== */
        .app-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), #2196F3);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            flex-shrink: 0;
        }
        .logo-icon img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }
        .logo-text {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.01em;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 400;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 500;
            white-space: nowrap;
        }
        .header-badge.online {
            background: var(--success-light);
            color: var(--success);
        }
        .header-badge.offline {
            background: var(--danger-light);
            color: var(--danger);
        }
        .header-badge.recording {
            background: var(--danger-light);
            color: var(--danger);
            animation: blink-badge 1s ease-in-out infinite;
        }
        @keyframes blink-badge {
            0%,
            100% { opacity: 1; }
            50% { opacity: 0.45; }
        }
        .header-badge .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
        }
        .header-badge.online .dot,
        .header-badge.recording .dot {
            background: var(--success);
            animation: pulse-dot 2s infinite;
        }
        .header-badge.recording .dot {
            background: var(--danger);
        }
        @keyframes pulse-dot {
            0%, 100% { box-shadow: 0 0 0 0 rgba(45,138,86,0.5); }
            50% { box-shadow: 0 0 0 8px rgba(45,138,86,0); }
        }
        .cache-clear-btn {
            font-size: 0.72rem;
            padding: 3px 10px;
            border-radius: 12px;
            border: 1px solid #d0d5db;
            background: #fff;
            color: var(--text-muted);
            cursor: pointer;
            margin-left: 8px;
            transition: all 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .cache-clear-btn:hover {
            background: #fee2e2;
            border-color: #fecaca;
            color: #dc2626;
        }

        /* ===== 主布局：上下结构 ===== */
        .main-wrapper {
            max-width: 1440px;
            margin: 0 auto;
            padding: 12px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-height: calc(100vh - 56px);
        }

        /* ----- 顶部紧凑语音栏 ----- */
        .voice-compact-bar {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 8px 18px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            transition: box-shadow var(--transition);
        }
        .voice-compact-bar:hover {
            box-shadow: var(--shadow-lg);
        }
        .voice-control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .voice-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            background: var(--primary);
            color: #fff;
            box-shadow: 0 2px 8px rgba(26,111,181,0.3);
            outline: none;
            flex-shrink: 0;
        }
        .voice-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }
        .voice-btn:active {
            transform: scale(0.94);
        }
        .voice-btn.recording {
            background: var(--danger);
            box-shadow: 0 2px 12px rgba(209,67,67,0.4);
            animation: pulse-rec 1.5s ease-in-out infinite;
        }
        @keyframes pulse-rec {
            0%, 100% { box-shadow: 0 2px 12px rgba(209,67,67,0.4), 0 0 0 0 rgba(209,67,67,0.25); }
            50% { box-shadow: 0 2px 12px rgba(209,67,67,0.4), 0 0 0 12px rgba(209,67,67,0); }
        }
        .voice-btn:disabled {
            background: #c8cdd4;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .stop-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--danger);
            color: #fff;
            box-shadow: 0 2px 6px rgba(209,67,67,0.3);
            transition: all var(--transition);
            outline: none;
            flex-shrink: 0;
        }
        .stop-btn:hover:not(:disabled) {
            background: #b83838;
            transform: translateY(-1px);
        }
        .stop-btn:disabled {
            background: #c8cdd4;
            cursor: not-allowed;
            box-shadow: none;
        }
        .voice-timer {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
            font-variant-numeric: tabular-nums;
            font-family: var(--font-mono);
            min-width: 56px;
            text-align: center;
        }
        .voice-hint {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
            white-space: nowrap;
            min-width: 100px;
        }
        .voice-live-text {
            flex: 1;
            min-width: 150px;
            background: var(--surface-alt);
            border-radius: 20px;
            padding: 4px 16px;
            border: 1px solid var(--border);
            font-size: 0.9rem;
            color: var(--text-secondary);
            transition: border-color var(--transition);
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            line-height: 2;
        }
        .voice-live-text.active {
            border-color: var(--primary);
            color: var(--text);
        }
        .voice-live-text .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: var(--primary);
            margin-left: 2px;
            animation: cursor-blink 0.8s ease-in-out infinite;
            vertical-align: middle;
        }
        @keyframes cursor-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .recording-badge-compact {
            font-size: 0.7rem;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 600;
            background: #f0f1f3;
            color: var(--text-muted);
            margin-left: auto;
            white-space: nowrap;
        }
        .recording-badge-compact.recording {
            background: var(--danger-light);
            color: var(--danger);
            animation: blink-badge 1s ease-in-out infinite;
        }

        /* ----- 中间：报告编辑区（原右侧面板） ----- */
        .panel {
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            padding: 20px 24px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: box-shadow var(--transition);
            flex: 1;
        }
        .panel:hover {
            box-shadow: var(--shadow-lg);
        }
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-shrink: 0;
        }
        .panel-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.01em;
        }
        .panel-title .icon {
            width: 28px;
            height: 28px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
        }
        .icon-blue { background: var(--primary-light); color: var(--primary); }
        .icon-green { background: var(--success-light); color: var(--success); }
        .edit-mode-badge {
            background: #fef3c7;
            color: #b45309;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
            display: none;
            align-items: center;
            gap: 6px;
        }
        .edit-mode-badge.show { display: inline-flex; }
        .edit-mode-badge .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #b45309;
            animation: pulse-dot 1.5s infinite;
        }
        .edit-mode-badge .btn-danger-outline {
            border-color: #b45309;
            color: #b45309;
            background: transparent;
            font-size: 0.65rem;
            padding: 1px 10px;
            border-radius: 10px;
        }
        .edit-mode-badge .btn-danger-outline:hover {
            background: #b45309;
            color: #fff;
        }
        .form-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 100px;
        }
        .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .form-group input,
        .form-group select {
            height: 38px;
            padding: 0 11px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            font-family: inherit;
            color: var(--text);
            background: var(--surface-alt);
            transition: all var(--transition);
            width: 100%;
            outline: none;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26,111,181,0.08);
            background: #fff;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 18px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 600;
            border: 1.5px solid transparent;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            white-space: nowrap;
            letter-spacing: 0.01em;
            outline: none;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 2px 6px rgba(26,111,181,0.2);
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
            box-shadow: 0 4px 12px rgba(26,111,181,0.3);
        }
        .btn-primary:disabled {
            background: #a3c8e6;
            border-color: #a3c8e6;
            cursor: not-allowed;
            box-shadow: none;
        }
        .btn-outline {
            background: #fff;
            color: var(--text);
            border-color: var(--border);
        }
        .btn-outline:hover {
            background: var(--surface-alt);
            border-color: #c5c9d0;
        }
        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border-color: transparent;
            padding: 6px 10px;
        }
        .btn-ghost:hover {
            background: #f0f1f3;
            color: var(--text);
        }
        .btn-lg {
            padding: 12px 24px;
            font-size: 0.95rem;
            border-radius: var(--radius);
        }
        .btn-sm {
            padding: 5px 12px;
            font-size: 0.78rem;
            border-radius: 4px;
        }
        .btn-danger-outline {
            background: #fff;
            color: var(--danger);
            border-color: var(--danger);
        }
        .btn-danger-outline:hover {
            background: var(--danger-light);
            border-color: var(--danger);
        }
        .patient-card {
            background: var(--surface-alt);
            border-radius: var(--radius);
            padding: 14px 16px;
            border: 1px solid var(--border-light);
            margin: 4px 0 8px;
        }
        .patient-card .row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }
        .patient-card .label {
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-right: 4px;
        }
        .patient-card .value { font-weight: 500; }
        .check-items {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 6px;
        }
        .check-item-wrapper {
            background: #fff;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 6px 12px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            font-size: 0.8rem;
            line-height: 1.5;
            width: 100%;
        }
        .check-item-wrapper:hover { border-color: var(--primary); }
        .check-item-wrapper.selected {
            border-color: var(--primary);
            background: var(--primary-light);
        }
        .check-item-wrapper .item-name { font-weight: 600; }
        .check-item-wrapper .item-meta {
            color: var(--text-muted);
            font-size: 0.7rem;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .text-editor-area {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }
        .text-editor-area label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }
        .text-editor-area textarea {
            flex: 1;
            min-height: 160px;
            padding: 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            font-size: 0.9rem;
            font-family: inherit;
            color: var(--text);
            background: var(--surface-alt);
            resize: vertical;
            line-height: 1.7;
            outline: none;
            transition: all var(--transition);
            width: 100%;
        }
        .text-editor-area textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26,111,181,0.08);
            background: #fff;
        }
        .text-editor-area textarea::placeholder {
            color: #c0c5cc;
        }
        .textarea-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .error-msg {
            background: var(--danger-light);
            color: var(--danger);
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            display: none;
            font-size: 0.85rem;
        }
        .error-msg.show { display: block; }
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-lg);
            z-index: 10;
            flex-direction: column;
            gap: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .loading-overlay.show { display: flex; }
        .spinner-dark {
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(0,0,0,0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: inline-block;
            flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== 底部：历史报告（折叠） ===== */
        .history-section {
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: box-shadow var(--transition);
        }
        .history-section:hover {
            box-shadow: var(--shadow-lg);
        }
        .history-toggle {
            padding: 12px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            border-bottom: 1px solid var(--border-light);
            transition: background 0.15s;
        }
        .history-toggle:hover {
            background: var(--surface-alt);
        }
        .history-toggle span:first-child {
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .history-toggle .toggle-icon {
            font-size: 1.2rem;
            transition: transform 0.2s;
        }
        .history-content {
            padding: 16px 20px 20px;
            display: none;
        }
        .report-list {
            width: 100%;
        }
        .report-list .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .report-list .header h3 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
        }
        .report-list table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
            table-layout: fixed;
        }
        .report-list th {
            text-align: left;
            padding: 6px 4px;
            border-bottom: 2px solid var(--border);
            color: var(--text-secondary);
            font-weight: 600;
            white-space: nowrap;
        }
        .report-list td {
            padding: 6px 4px;
            border-bottom: 1px solid var(--border-light);
            vertical-align: middle;
            word-break: break-word;
        }
        /* 列宽分配（与原来一致） */
        .report-list th:nth-child(1), .report-list td:nth-child(1) { width: 7%; }
        .report-list th:nth-child(2), .report-list td:nth-child(2) { width: 7%; }
        .report-list th:nth-child(3), .report-list td:nth-child(3) { width: 5%; }
        .report-list th:nth-child(4), .report-list td:nth-child(4) { width: 5%; }
        .report-list th:nth-child(5), .report-list td:nth-child(5) { width: 5%; }
        .report-list th:nth-child(6), .report-list td:nth-child(6) { width: 10%; }
        .report-list th:nth-child(7), .report-list td:nth-child(7) { width: 9%; }
        .report-list th:nth-child(8), .report-list td:nth-child(8) { width: 8%; }
        .report-list th:nth-child(9), .report-list td:nth-child(9) { width: 8%; }
        .report-list th:nth-child(10), .report-list td:nth-child(10) { width: 8%; }
        .report-list th:nth-child(11), .report-list td:nth-child(11) { width: 8%; }
        .report-list th:nth-child(12), .report-list td:nth-child(12) { width: 12%; }

        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.65rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .status-badge.generated { background: var(--success-light); color: var(--success); }
        .status-badge.pending { background: var(--warning-light); color: var(--warning); }
        .status-badge.processing { background: var(--processing-light); color: var(--processing); }

        .btn-view {
            padding: 2px 10px;
            font-size: 0.65rem;
            border-radius: 10px;
            border: 1px solid var(--primary);
            background: #fff;
            color: var(--primary);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn-view:hover:not(:disabled) {
            background: var(--primary);
            color: #fff;
        }
        .btn-view:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #f0f1f3;
            border-color: #ccc;
            color: #999;
        }
        .btn-detail {
            padding: 2px 8px;
            font-size: 0.65rem;

            pointer-events: auto;

        @keyframes toast-in {

            to { opacity:1; transform: translateX(0); }

<body>

            <div style="display:flex; justify-content:center; gap:12px;">
                <button class="btn btn-outline" id="confirmCancelBtn" style="min-width:80px;">取消</button>

    <!-- ============================================================ -->
    <!-- ===== JavaScript ===== -->
    <script>
        (function() {
            // =========================================================
            // 第一部分：语音转写功能（核心逻辑保留，布局适配）
            // =========================================================
            function getApiConfig() {
                const host = window.location.hostname;
                const portMap = {
                    'oa.nsyy.com.cn': 6080,
                    '192.168.3.12':   6083,
                    '192.168.124.9':  8081,
                    '127.0.0.1':      8081,
                    'localhost':      8081,
                };
                let port = portMap[host] || 8081;
                if (host === 'oa.nsyy.com.cn') {
                    return { apiBase: `https://${host}:6081/mz`, wsUrl: `wss://${host}:6081/mz` };
                }
                if (host === '192.168.3.12') {
                    return { apiBase: `https://${host}:6083/mz`, wsUrl: `wss://${host}:6083/mz` };
                }
                return { apiBase: `http://${host}:${port}/mz`, wsUrl: `ws://${host}:${port}/mz` };
            }
            const config = getApiConfig();
            const API_BASE = config.apiBase;
            const WS_URL = config.wsUrl;

            // ---- DOM 元素 ----
            const $ = (sel) => document.querySelector(sel);
            const startBtn = $('#startBtn');
            const stopBtn = $('#stopBtn');
            const voiceTimer = $('#voiceTimer');
            const voiceHint = $('#voiceHint');
            const voiceLiveText = $('#voiceLiveText');
            const recordingBadge = $('#recordingBadgeCompact');
            const wsStatusBadge = $('#wsStatusBadge');
            const voiceStatusBadge = $('#voiceStatusBadge');
            const errorMsg = $('#errorMsg');
            const btnClear = $('#btnClear');
            const btnCopy = $('#btnCopy');
            const wordCountEl = $('#wordCount');
            const sentenceCountEl = $('#sentenceCount');
            const examFindingsTextarea = $('#examFindings');

            // ---- 状态 ----
            let ws = null;
            let mediaStream = null;
            let audioContext = null;
            let source = null;
            let processor = null;
            let isRecording = false;
            let isConnected = false;
            let fullText = '';          // 保留用于统计
            let currentStash = '';
            let sentenceCountVal = 0;
            let heartbeatInterval = null;
            let connectionStatus = 'disconnected';
            const SAMPLE_RATE = 16000;
            const CHUNK_SIZE = 4096;

            // 保存录音
            let mediaRecorder = null;
            let audioChunks = [];

            // ---- 本地暂存 ----
            const STORAGE_KEY = 'medical_asr_report_draft';
            function saveDraft() {
                const draft = { examFindings: examFindingsTextarea.value, updatedAt: Date.now() };
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(draft)); } catch (e) {}
            }
            function loadDraft() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return false;
                    const draft = JSON.parse(raw);
                    if (draft.examFindings) {
                        examFindingsTextarea.value = draft.examFindings;
                        fullText = draft.examFindings;
                        updateWordCount();
                        updateSentenceCount();
                    }
                    return true;
                } catch (e) { return false; }
            }
            function clearDraft() { localStorage.removeItem(STORAGE_KEY); }

            let saveTimeout;
            function debouncedSave() {
                clearTimeout(saveTimeout);
                saveTimeout = setTimeout(saveDraft, 300);
            }
            examFindingsTextarea.addEventListener('input', function() {
                updateWordCount();
                updateSentenceCount();
                debouncedSave();
                // 同步 fullText 以便统计（但不影响转写追加逻辑）
                fullText = this.value;
            });

            $('#clearCacheBtn').addEventListener('click', async function() {
                const confirmed = await showConfirmDialog('清除暂存', '确定清除所有本地暂存数据吗？');
                if (confirmed) {
                    clearDraft();
                    examFindingsTextarea.value = '';
                    fullText = '';
                    currentStash = '';
                    sentenceCountVal = 0;
                    sentenceCountEl.textContent = '0';
                    updateWordCount();
                    showToast('暂存数据已清除', 'info');
                }
            });

            // ---- Toast ----
            function showToast(message, type = 'info') {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = 'toast ' + type;
                const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
                toast.textContent = (icons[type] || '') + ' ' + message;
                container.appendChild(toast);
                setTimeout(() => {
                    if (toast.parentNode) {
                        toast.classList.add('removing');
                        toast.addEventListener('animationend', () => toast.remove());
                    }
                }, 3000);
            }

            // ---- 连接管理 ----
            function setConnectionStatus(status) {
                connectionStatus = status;
                const badge = wsStatusBadge;
                badge.className = 'header-badge';
                if (status === 'connected') {
                    badge.classList.add('online');
                    badge.innerHTML = '<span class="dot"></span> 服务已连接';
                    voiceHint.textContent = '点击麦克风开始语音录入';
                } else if (status === 'connecting') {
                    badge.classList.add('online');
                    badge.innerHTML = '<span class="dot"></span> 连接中...';
                    voiceHint.textContent = '正在连接语音服务，请稍候...';
                } else {
                    badge.classList.add('offline');
                    badge.innerHTML = '<span class="dot"></span> 未连接';
                    voiceHint.textContent = '未连接，点击麦克风建立连接';
                }
            }

            async function connect() {
                if (isConnected || connectionStatus === 'connecting') return;
                setConnectionStatus('connecting');
                const wsUrl = `${WS_URL}/asr/ws/transcribe`;
                try {
                    ws = new WebSocket(wsUrl);
                    ws.onopen = () => {
                        isConnected = true;
                        setConnectionStatus('connected');
                        startBtn.disabled = false;
                        stopBtn.disabled = true;
                        showError('');
                        console.log('WebSocket 连接成功');
                    };
                    ws.onmessage = (event) => { handleMessage(event.data); };
                    ws.onclose = () => {
                        isConnected = false;
                        setConnectionStatus('disconnected');
                        startBtn.disabled = false;
                        stopBtn.disabled = true;
                        if (isRecording) stopRecording();
                        showToast('语音服务连接已断开，请点击麦克风重新连接', 'warning');
                    };
                    ws.onerror = (error) => {
                        console.error('WebSocket 错误:', error);
                        setConnectionStatus('disconnected');
                        showError('WebSocket 连接错误，请检查网络');
                        showToast('连接失败，请刷新页面或稍后重试', 'error');
                    };
                } catch (err) {
                    console.error('连接失败:', err);
                    setConnectionStatus('disconnected');
                    showToast('连接失败：' + err.message, 'error');
                }
            }

            // ---- 消息处理 ----
            function handleMessage(rawData) {
                try {
                    const data = JSON.parse(rawData);
                    const type = data.type;
                    switch (type) {
                        case 'stash': {
                            const delta = data.text || '';
                            if (delta) {
                                currentStash += delta;
                                updateLiveTextWithTyping(currentStash);
                                // 不更新文本框，仅预览
                            }
                            break;
                        }
                        case 'final': {
                            const text = data.text || '';
                            if (text.trim()) {
                                currentStash = '';
                                // 追加到 fullText（用于统计）
                                fullText += text;
                                if (!text.endsWith('。') && !text.endsWith('！') && !text.endsWith('？')) {
                                    fullText += '。';
                                }
                                sentenceCountVal++;
                                sentenceCountEl.textContent = sentenceCountVal;

                                // ★★★ 追加到 检查所见 文本框 ★★★
                                let currentVal = examFindingsTextarea.value;
                                if (currentVal.length > 0 && !'。！？'.includes(currentVal.slice(-1))) {
                                    examFindingsTextarea.value = currentVal + '。' + text;
                                } else {
                                    examFindingsTextarea.value = currentVal + text;
                                }
                                // 触发 input 事件，更新字数统计及自动保存
                                examFindingsTextarea.dispatchEvent(new Event('input'));
                                updateWordCount();
                                // 滚动到底部
                                examFindingsTextarea.scrollTop = examFindingsTextarea.scrollHeight;
                                // 清空实时预览
                                voiceLiveText.innerHTML = '';
                                voiceLiveText.classList.remove('active');
                            }
                            break;

                        case 'speech_start': {

                        case 'error': {
                            const errText = data.text || 'ASR 服务错误';

                                if (ws && ws.readyState === WebSocket.OPEN) {

                                }
                            }
                            break;
                        }
                        case 'pong': break;
                    }

            // ---- 录音核心 ----
            async function startRecording() {
                if (isRecording) return;
                const isWsAlive = isConnected && ws && ws.readyState === WebSocket.OPEN;
                if (!isWsAlive) {
                    if (ws) { try { ws.close(); } catch (e) {} ws = null; }
                    isConnected = false;
                    setConnectionStatus('disconnected');
                    await connect();
                    let waitCount = 0;
                    while (!isConnected && waitCount < 30) {
                        await new Promise(resolve => setTimeout(resolve, 100));
                        waitCount++;
                    }
                    if (!isConnected) {
                        showToast('❌ 无法连接语音服务，请稍后重试', 'error');
                        return;
                    }
                }
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({
                        audio: { sampleRate: SAMPLE_RATE, channelCount: 1, echoCancellation: true, noiseSuppression: true }
                    });
                    // 录音保存
                    mediaRecorder = new MediaRecorder(mediaStream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        let patientName = document.getElementById('pName')?.textContent.trim() || '未知患者';
                        const cleanName = patientName.replace(/[\\/:*?"<>|]/g, '');
                        const now = new Date();
                        const pad = (n) => String(n).padStart(2, '0');
                        const localTime = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
                        a.download = `录音_${cleanName}_${localTime}.webm`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                        audioChunks = [];
                    };
                    mediaRecorder.start();

                    audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SAMPLE_RATE });
                    const audioSource = audioContext.createMediaStreamSource(mediaStream);
                    const audioProcessor = audioContext.createScriptProcessor(CHUNK_SIZE, 1, 1);
                    audioSource.connect(audioProcessor);
                    audioProcessor.connect(audioContext.destination);

                    isRecording = true;
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    setRecordingUI(true);
                    voiceStatusBadge.className = 'header-badge recording';
                    voiceStatusBadge.innerHTML = '<span class="dot"></span> 录音中';

                    audioProcessor.onaudioprocess = (e) => {
                        if (!isRecording || !isConnected) return;
                        const inputData = e.inputBuffer.getChannelData(0);
                        const pcmData = float32ToInt16(inputData);
                        const base64Data = arrayBufferToBase64(pcmData);
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ type: 'audio', data: base64Data }));
                        }
                    };
                    processor = audioProcessor;
                    source = audioSource;
                    console.log('🎤 开始录音');
                    startTimer();
                    heartbeatInterval = setInterval(() => {
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ type: 'ping' }));
                        }
                    }, 15000);
                } catch (err) {
                    console.error('启动录音失败:', err);
                    showError('麦克风启动失败: ' + err.message);
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                    setRecordingUI(false);
                    isRecording = false;
                }
            }

            async function stopRecording() {
                if (!isRecording) return;
                isRecording = false;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                setRecordingUI(false);
                voiceStatusBadge.className = 'header-badge online';
                voiceStatusBadge.innerHTML = '<span class="dot"></span> 语音就绪';
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'commit' }));
                }
                if (processor) { processor.disconnect(); processor = null; }
                if (source) { source.disconnect(); source = null; }
                if (audioContext) { await audioContext.close(); audioContext = null; }
                if (mediaStream) { mediaStream.getTracks().forEach(track => track.stop()); mediaStream = null; }
                console.log('⏹️ 停止录音');
                stopTimer();
                recordingBadge.textContent = '录入完成';
                recordingBadge.className = 'recording-badge-compact';
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                }
                if (heartbeatInterval) { clearInterval(heartbeatInterval); heartbeatInterval = null; }
            }

            // ---- 计时器 ----
            let recordingStartTime = null, timerInterval = null;
            function startTimer() {
                stopTimer();

            function stopTimer() {

            // ---- 音频工具 ----
            function float32ToInt16(float32Array) {
                const int16Array = new Int16Array(float32Array.length);
                for (let i = 0; i < float32Array.length; i++) {
                    const s = Math.max(-1, Math.min(1, float32Array[i]));
                    int16Array[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }
                return int16Array;
            }
            function arrayBufferToBase64(buffer) {
                const bytes = new Uint8Array(buffer.buffer);
                let binary = '';
                for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
                return btoa(binary);
            }

                        const resp = await fetch(`${API_BASE}/asr/pacs_ai_report/${recordId}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(updateData)
                        });
                        if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
                        const result = await resp.json();
                        if (result.success === false) { throw new Error(result.message || '保存失败'); }
                        const fieldLabel = field === 'patient_info' ? '患者信息' : '指标数据';
                        showToastPacs(`${fieldLabel}已更新 ✅`, 'success');
                        closeModal();
                        loadReports(currentPage);
                    } catch (err) {
                        showToastPacs('保存失败：' + err.message, 'error');
                    } finally { showLoading(false); }
                }

                // ---- 患者查询 ----
                async function queryPatient() {
                    if (isEditMode) {
                        showToastPacs('当前处于编辑模式，请先取消编辑或完成重新提交', 'warning');
                        return;
                    }
                    const zhuyuanhao = zhuyuanhaoInput.value.trim();
                    if (!zhuyuanhao) { showToastPacs('请输入住院号/门诊号', 'warning'); return; }
                    const patientTypeSelect = document.getElementById('patientTypeSelect');
                    const patientType = patientTypeSelect ? patientTypeSelect.value : 'inpatient';
                    const checkTypeSelect = document.getElementById('checkTypeSelect');
                    const checkType = checkTypeSelect ? checkTypeSelect.value : 'US';
                    showLoading(true);
                    try {
                        const resp = await fetch(`${API_BASE}/asr/patient_pacs_info/${zhuyuanhao}/${patientType}/${checkType}`);
                        if (!resp.ok) throw new Error('患者信息查询失败');
                        const data = await resp.json();
                        currentPatient = data;
                        displayPatientInfo(data);
                        const items = data.check_items_list || [];
                        if (items.length === 1) {
                            selectedCheckItem = items[0].check_item;
                            selectedYizhuid = items[0].yizhuid;
                            highlightCheckItem(selectedCheckItem);
                        } else {
                            selectedCheckItem = null;
                            selectedYizhuid = null;
                        }
                        updateSubmitButton();
                    } catch (err) {
                        showToastPacs('查询失败：' + err.message, 'error');
                        patientInfoArea.style.display = 'none';
                        currentPatient = null;
                        updateSubmitButton();
                    } finally { showLoading(false); }
                }

                function displayPatientInfo(data) {
                    pName.textContent = data.patient_name || '-';
                    pSex.textContent = data.patient_sex || '-';
                    pAge.textContent = data.patient_age || '-';
                    pDept.textContent = data.dept_name || '-';
                    patientInfoArea.style.display = 'block';
                    const items = data.check_items_list || [];
                    checkItemsContainer.innerHTML = '';
                    if (items.length === 0) {
                        checkItemsContainer.innerHTML = '<span style="color:var(--text-muted);">无检查项目</span>';
                        return;
                    }
                    items.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'check-item-wrapper';
                        div.innerHTML = `
                            <div class="item-name">${escapeHtml(item.check_item)}  -  ${escapeHtml(item.kaishisj)}</div>
                            <div class="item-meta">
                                <span>医嘱ID: ${escapeHtml(item.yizhuid)}</span>
                                <span>开嘱: ${escapeHtml(item.kaizhusj)}</span>
                                <span>开始: ${escapeHtml(item.kaishisj)}</span>
                                <span>类型: ${escapeHtml(item.jianchabzfl)}</span>
                            </div>
                        `;
                        div.dataset.value = item.check_item;
                        div.dataset.yizhuid = item.yizhuid;
                        div.addEventListener('click', function() {
                            if (this.classList.contains('disabled')) return;
                            document.querySelectorAll('.check-item-wrapper').forEach(el => el.classList.remove('selected'));
                            this.classList.add('selected');
                            selectedCheckItem = this.dataset.value;
                            selectedYizhuid = this.dataset.yizhuid;
                            updateSubmitButton();
                        });
                        checkItemsContainer.appendChild(div);
                    });
                    if (items.length === 1) {
                        const first = checkItemsContainer.querySelector('.check-item-wrapper');
                        if (first) { first.classList.add('selected');
                            selectedCheckItem = first.dataset.value;
                            selectedYizhuid = first.dataset.yizhuid; }
                    }
                }

                function highlightCheckItem(item) {
                    document.querySelectorAll('.check-item-wrapper').forEach(el => {
                        el.classList.toggle('selected', el.dataset.value === item);
                    });
                }

                function updateSubmitButton() {
                    const hasPatient = currentPatient !== null;
                    const hasItem = selectedCheckItem !== null;
                    const hasFindings = document.getElementById('examFindings').value.trim().length > 0;
                    submitBtn.disabled = !(hasPatient && hasItem && hasFindings);
                }

                function clearEditArea() {
                    examFindingsTextarea.value = '';
                    fullText = '';
                    currentStash = '';
                    sentenceCountVal = 0;
                    sentenceCountEl.textContent = '0';
                    updateWordCount();
                    clearDraft();
                }

                function hasPendingContent() {
                    return examFindingsTextarea.value.trim().length > 0;
                }

                // ---- 重新编辑 ----
                async function startEdit(record) {
                    if (hasPendingContent()) {
                        const confirmed = await showConfirmDialog(
                            '清空当前内容',
                            `当前有未提交的内容（检查所见），确认清空并加载患者【${record.patient_name || '未知患者'}】的记录继续重新编辑吗？`
                        );
                        if (!confirmed) return;
                        clearEditArea();
                    }
                    beforeEditFullText = fullText;
                    beforeEditExamFindings = examFindingsTextarea.value;

                    isEditMode = true;
                    editingRecordId = record.id;
                    editingRecordData = record;

                    const patientData = {
                        patient_name: record.patient_name || '-',
                        patient_sex: record.patient_sex || '-',
                        patient_age: record.patient_age || '-',
                        dept_name: record.dept_name || '-',
                        zhuyuanhao: record.zhuyuanhao || '',
                        check_items_list: [{
                            check_item: record.check_items || '-',
                            yizhuid: record.yizhuid || '',
                            kaishisj: record.submit_time || '',
                            kaizhusj: '',
                            jianchabzfl: ''
                        }]
                    };
                    currentPatient = patientData;
                    displayPatientInfo(patientData);
                    if (patientData.check_items_list.length === 1) {
                        selectedCheckItem = patientData.check_items_list[0].check_item;
                        selectedYizhuid = patientData.check_items_list[0].yizhuid;
                        highlightCheckItem(selectedCheckItem);
                    }
                    const patientInfo = record.patient_info || '';
                    examFindingsTextarea.value = patientInfo;
                    fullText = patientInfo;
                    currentStash = '';
                    sentenceCountVal = patientInfo.split(/[。！？\n]/).filter(s => s.trim().length > 0).length;
                    sentenceCountEl.textContent = sentenceCountVal;
                    updateWordCount();
                    saveDraft();
                    zhuyuanhaoInput.value = record.zhuyuanhao || '';
                    submitBtn.textContent = '🔄 重新提交';
                    submitBtn.disabled = false;
                    editModeBadge.classList.add('show');
                    queryBtn.textContent = '🔍 查询';
                    showToastPacs(`已加载记录 #${record.id} 进入编辑模式`, 'info');
                }

                async function cancelEdit() {
                    if (!isEditMode) return;
                    if (hasPendingContent()) {
                        const confirmed = await showConfirmDialog('取消编辑', '确定要取消编辑吗？当前修改将丢失。');
                        if (!confirmed) return;
                    }
                    clearEditArea();
                    patientInfoArea.style.display = 'none';
                    currentPatient = null;
                    selectedCheckItem = null;
                    selectedYizhuid = null;
                    zhuyuanhaoInput.value = '';
                    exitEditMode();
                    showToastPacs('已取消编辑', 'info');
                }

                function exitEditMode() {
                    isEditMode = false;
                    editingRecordId = null;
                    editingRecordData = null;
                    submitBtn.textContent = '⚡ 提交';
                    submitBtn.disabled = true;
                    editModeBadge.classList.remove('show');
                    queryBtn.textContent = '🔍 查询';
                    loadReports(currentPage);
                }

                // ---- 提交报告 ----
                async function submitReport() {
                    if (submitBtn.disabled) return;
                    // 如果正在录音，先停止
                    if (isRecording) {
                        await stopRecording();
                    }
                    const examFindings = document.getElementById('examFindings').value.trim();
                    if (!examFindings) {
                        showToastPacs('检查所见不能为空', 'warning');
                        return;
                    }
                    const patientTypeSelect = document.getElementById('patientTypeSelect');
                    const patientType = patientTypeSelect ? patientTypeSelect.value : 'inpatient';

                    if (isEditMode && editingRecordId) {
                        showLoading(true);
                        submitBtn.disabled = true;
                        try {
                            const updateData = {
                                patient_info: examFindings,
                                re_edit: true
                            };
                            const resp = await fetch(`${API_BASE}/asr/pacs_ai_report/${editingRecordId}`, {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(updateData)
                            });
                            if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
                            const result = await resp.json();
                            if (result.success === false) {
                                throw new Error(result.message || '更新失败');
                            }
                            showToastPacs('报告已更新，正在重新生成...', 'success');
                            clearEditArea();
                            exitEditMode();
                            loadReports(currentPage);
                        } catch (err) {
                            showToastPacs('重新提交失败：' + err.message, 'error');
                        } finally {
                            showLoading(false);
                            submitBtn.disabled = false;
                            updateSubmitButton();
                        }
                        return;
                    }

                    // 普通提交
                    if (!currentPatient) {
                        showToastPacs('请先查询患者信息', 'warning');
                        return;
                    }
                    if (!selectedCheckItem) {
                        showToastPacs('请选择一个检查项目', 'warning');
                        return;
                    }
                    const data = {
                        zhuyuanhao: currentPatient.zhuyuanhao,
                        patient_name: currentPatient.patient_name,
                        patient_age: currentPatient.patient_age,
                        patient_sex: currentPatient.patient_sex,
                        dept_id: currentPatient.dept_id,
                        dept_name: currentPatient.dept_name,
                        yizhiid: currentPatient.yizhiid,
                        check_items: selectedCheckItem,
                        yizhuid: selectedYizhuid,
                        patient_info: examFindings,
                        patient_type: patientType
                    };
                    showLoading(true);
                    submitBtn.disabled = true;
                    try {
                        const resp = await fetch(`${API_BASE}/asr/pacs-submit`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(data)
                        });
                        if (!resp.ok) throw new Error(`提交失败 ${resp.status}: ${resp.statusText}`);
                        const result = await resp.json();
                        if (result.success === false) {
                            throw new Error(result.message || '提交失败，请检查数据');
                        }
                        showToastPacs('提交成功，报告生成中...', 'success');
                        document.getElementById('examFindings').value = '';
                        fullText = '';
                        currentStash = '';
                        sentenceCountVal = 0;
                        sentenceCountEl.textContent = '0';
                        updateWordCount();
                        clearDraft();
                        loadReports(currentPage);
                        updateSubmitButton();
                    } catch (err) {
                        showToastPacs('提交失败：' + err.message, 'error');
                    } finally {
                        showLoading(false);
                        submitBtn.disabled = false;
                        updateSubmitButton();
                    }
                }

                // ---- 历史报告加载 ----
                async function loadReports(page = 1) {
                    showLoading(true);
                    try {
                        const url = `${API_BASE}/asr/pacs_ai_reports?page=${page}&page_size=${PAGE_SIZE}`;
                        const resp = await fetch(url);
                        if (!resp.ok) throw new Error('获取列表失败');
                        const result = await resp.json();
                        const data = result.data || [];
                        const total = result.total || 0;
                        renderTable(data);
                        renderPagination(page, total);
                    } catch (err) {
                        showToastPacs('加载列表失败：' + err.message, 'error');
                    } finally { showLoading(false); }
                }

                function renderTable(data) {
                    if (!data || data.length === 0) {
                        reportTableBody.innerHTML = `<tr><td colspan="12" style="text-align:center;color:var(--text-muted);">暂无记录</td></tr>`;
                        return;
                    }
                    window._reportTableData = data;
                    let html = '';
                    data.forEach((item, index) => {
                        const statusText = item.report_status === 1 ?
                            '报告已生成' :
                            (item.indicator_status === 1 ?
                                '报告生成中' :
                                (item.indicator_status === 0 && item.indicator_data === null ?
                                    '指标提取中' :
                                    '指标不完善，请补充'));
                        const statusClass = item.report_status === 1 ? 'generated' : (item.indicator_status === 1 ? 'processing' : 'pending');
                        const btnDisabled = item.report_status !== 1;
                        html += `<tr data-record-id="${item.id}" data-index="${index}">
                                <td>${item.zhuyuanhao || '-'}</td>
                                <td>${item.patient_type || '-'}</td>
                                <td>${item.patient_name || '-'}</td>
                                <td>${item.patient_sex || '-'}</td>
                                <td>${item.patient_age || '-'}</td>
                                <td>${item.check_items || '-'}</td>
                                <td>${item.submit_time || '-'}</td>
                                <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                                <td><button class="btn-detail edit-field" data-index="${index}" data-field="patient_info">✏️ 查看/编辑</button></td>
                                <td><button class="btn-detail edit-field" data-index="${index}" data-field="indicator_data">✏️ 查看/编辑</button></td>
                                <td><button class="btn-detail edit-field-text" data-index="${index}" data-field="indicator_data">📝 文本编辑</button></td>
                                <td>
                                    <button class="btn-view" data-id="${item.id}" ${btnDisabled ? 'disabled' : ''}>
                                        ${btnDisabled ? '⏳ 生成中' : '📄 查看报告'}
                                    </button>
                                    <button class="btn-reedit" data-id="${item.id}" data-index="${index}" title="重新编辑此报告">✏️ 重新编辑</button>
                                </td>
                            </tr>`;
                    });
                    reportTableBody.innerHTML = html;

                    reportTableBody.querySelectorAll('.edit-field').forEach(btn => {
                        btn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            const index = parseInt(this.dataset.index);
                            const field = this.dataset.field;
                            const record = window._reportTableData[index];
                            if (!record) { showToastPacs('数据不存在', 'error'); return; }
                            const content = record[field] || '暂无';
                            const label = field === 'patient_info' ? '患者信息' : '指标数据';
                            openModal(`📋 ${label}（可编辑）`, content, true, record.id, field);
                        });
                    });
                    reportTableBody.querySelectorAll('.edit-field-text').forEach(btn => {
                        btn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            const index = parseInt(this.dataset.index);
                            const record = window._reportTableData[index];
                            if (!record) { showToastPacs('数据不存在', 'error'); return; }
                            const content = record.indicator_data || '暂无';
                            openModal('📋 指标数据（文本编辑）', content, true, record.id, 'indicator_data', true);
                        });
                    });
                    reportTableBody.querySelectorAll('.btn-view:not([disabled])').forEach(btn => {
                        btn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            const id = this.dataset.id;
                            viewReport(id);
                        });
                    });
                    reportTableBody.querySelectorAll('.btn-reedit').forEach(btn => {
                        btn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            const index = parseInt(this.dataset.index);
                            const record = window._reportTableData[index];
                            if (!record) { showToastPacs('数据不存在', 'error'); return; }
                            startEdit(record);
                        });
                    });
                    reportTableBody.querySelectorAll('tr[data-record-id]').forEach(row => {
                        row.addEventListener('dblclick', async function(e) {
                            if (e.target.closest('button')) return;
                            const recordId = this.dataset.recordId;
                            const index = parseInt(this.dataset.index);
                            const record = window._reportTableData[index];
                            if (!record) return;
                            const confirmed = await showConfirmDialog(
                                '重新编辑记录',
                                `确认重新编辑 #${recordId} 患者【${record.patient_name || '未知患者'}】的记录吗？\n当前页面未提交的内容将被清空。`
                            );
                            if (confirmed) {
                                startEdit(record);
                            }
                        });
                        row.addEventListener('mouseenter', function() { this.classList.add('reedit-hover'); });
                        row.addEventListener('mouseleave', function() { this.classList.remove('reedit-hover'); });
                    });
                }

                function renderPagination(current, total) {
                    const totalPages = Math.ceil(total / PAGE_SIZE);
                    if (totalPages <= 1) { paginationControls.innerHTML = ''; return; }
                    let html = '';
                    html += `<button ${current <= 1 ? 'disabled' : ''} data-page="${current-1}">◀</button>`;
                    for (let i = 1; i <= totalPages; i++) {
                        html += `<button class="${i === current ? 'active' : ''}" data-page="${i}">${i}</button>`;
                    }
                    html += `<button ${current >= totalPages ? 'disabled' : ''} data-page="${current+1}">▶</button>`;
                    paginationControls.innerHTML = html;
                    paginationControls.querySelectorAll('button[data-page]').forEach(btn => {
                        btn.addEventListener('click', function() {
                            const page = parseInt(this.dataset.page);
                            if (!isNaN(page) && page >= 1 && page <= totalPages) {
                                currentPage = page;
                                loadReports(page);
                            }
                        });
                    });
                }

                async function viewReport(reportId) {
                    showLoading(true);
                    try {
                        const resp = await fetch(`${API_BASE}/asr/pacs_ai_report/${reportId}`);
                        if (!resp.ok) throw new Error('获取报告失败');
                        const data = await resp.json();
                        let content = '暂无报告内容';
                        if (data.report) {
                            if (typeof data.report === 'string') content = data.report;
                            else if (data.report.ai_report) content = data.report.ai_report;
                            else if (data.report.report) content = data.report.report;
                            else if (data.report.content) content = data.report.content;
                            else content = JSON.stringify(data.report, null, 2);
                        } else if (data.ai_report) {
                            content = data.ai_report;
                        } else if (data.content) {
                            content = data.content;
                        } else {
                            content = JSON.stringify(data, null, 2);
                        }
                        openModal('📄 报告详情', content, false);
                    } catch (err) {
                        showToastPacs('查看报告失败：' + err.message, 'error');
                    } finally { showLoading(false); }
                }

                // ---- 历史折叠 ----
                const historyToggle = document.getElementById('historyToggle');
                const historyContent = document.getElementById('historyContent');
                const toggleIcon = document.getElementById('toggleIcon');
                // 默认折叠
                let historyOpen = localStorage.getItem('historyOpen') === 'true';
                if (historyOpen) {
                    historyContent.style.display = 'block';
                    toggleIcon.textContent = '▼';
                } else {
                    historyContent.style.display = 'none';
                    toggleIcon.textContent = '▶';
                }
                historyToggle.addEventListener('click', function() {
                    const isOpen = historyContent.style.display !== 'none';
                    if (isOpen) {
                        historyContent.style.display = 'none';
                        toggleIcon.textContent = '▶';
                        localStorage.setItem('historyOpen', 'false');
                    } else {
                        historyContent.style.display = 'block';
                        toggleIcon.textContent = '▼';
                        localStorage.setItem('historyOpen', 'true');
                    }
                });

                // ---- 事件绑定 ----
                queryBtn.addEventListener('click', queryPatient);
                zhuyuanhaoInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') queryPatient(); });
                submitBtn.addEventListener('click', submitReport);
                refreshListBtn.addEventListener('click', () => loadReports(currentPage));
                document.getElementById('examFindings').addEventListener('input', updateSubmitButton);
                cancelEditBtn.addEventListener('click', cancelEdit);

                // ---- 初始化 ----
                loadReports(1);
                submitBtn.disabled = true;
                console.log('报告模块初始化完成');
            })();
        })();
    </script>
</body>
</html>
