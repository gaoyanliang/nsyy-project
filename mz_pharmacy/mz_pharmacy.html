<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>门诊取药 - 排队叫号系统</title>
    <link rel="stylesheet" href="pharmacy.css">
</head>
<body>
    <div class="container">
        <!-- 顶部导航 -->
        <header class="header">
            <div class="header-left">
                <div class="hospital-logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10.5 20.5L3.5 13.5C2.1 12.1 2.1 9.9 3.5 8.5L8.5 3.5C9.9 2.1 12.1 2.1 13.5 3.5L20.5 10.5C21.9 11.9 21.9 14.1 20.5 15.5L15.5 20.5C14.1 21.9 11.9 21.9 10.5 20.5Z"/>
                        <line x1="8.5" y1="8.5" x2="15.5" y2="15.5"/>
                    </svg>
                </div>
                <div class="header-title">
                    <h1>门诊取药管理</h1>
                    <div class="subtitle">药房窗口排队管理系统</div>
                </div>
            </div>
            <div class="header-center">
                <div class="datetime">
                    <div class="date" id="currentDate">2024-01-01</div>
                    <div class="time" id="currentTime">00:00:00</div>
                </div>
            </div>
            <div class="header-right">
                <a href="../mz_doctor_window/mz_doctor.html" class="window-switch-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <path d="M9 3v18"/>
                        <path d="M14 9h3"/>
                        <path d="M14 14h3"/>
                        <path d="M14 19h3"/>
                    </svg>
                    发药窗口
                </a>
                <div class="system-status" id="wsStatus">
                    <div class="status-dot"></div>
                    <span id="wsStatusText">连接中...</span>
                </div>
            </div>
        </header>

        <!-- Tab切换 -->
        <div class="tab-container">
            <button class="tab-btn active" data-tab="pending">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
                待取药列表
                <span class="tab-count" id="pendingCount">0</span>
            </button>
            <button class="tab-btn" data-tab="completed">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                    <polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
                已取药列表
                <span class="tab-count completed" id="completedCount">0</span>
            </button>
        </div>

        <!-- 主内容区域 - 患者列表（包含展开的药品信息） -->
        <div class="main-content">
            <div class="patient-list-container">
                <div class="section-header">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                    <h2 id="listTitle">待取药患者</h2>
                    <div class="voice-toggle">
                        <span class="voice-label">语音提醒</span>
                        <label class="switch">
                            <input type="checkbox" id="voiceSwitch" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
                <div class="patient-list" id="patientList">
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <span>加载中...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 患者信息弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3>患者信息</h3>
                <button class="modal-close" onclick="closeModal()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- 动态内容 -->
            </div>
        </div>
    </div>

    <script src="pharmacy.js"></script>
</body>
</html>
