<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>患者展示 - 排队叫号系统</title>
    <link rel="stylesheet" href="business.css">
</head>
<body>
    <div class="container">
        <!-- 顶部导航 -->
        <header class="header">
            <div class="hospital-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                </svg>
            </div>
            <div class="header-title">
                <h1 id="systemTitle">排队叫号系统</h1>
                <span class="subtitle">请留意屏幕显示</span>
            </div>
            <div class="window-info">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                    <circle cx="12" cy="10" r="3"/>
                </svg>
                <select id="windowSelect">
                    <option value="">加载中...</option>
                </select>
                <button id="fullscreenBtn" class="fullscreen-btn">全屏</button>
            </div>
        </header>

        <!-- 当前叫号大屏 -->
        <section class="current-call-display">
            <!-- 窗口名 - 顶部独立一行 -->
            <div class="window-badge" id="windowBadge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                    <circle cx="12" cy="10" r="3"/>
                </svg>
                <span id="windowName">窗口1</span>
            </div>

            <!-- 患者号码区 - 占满剩余空间居中 -->
            <div class="call-content">
                <div class="calls-display single" id="callsDisplay">
                    <div class="call-item">
                        <div class="call-number">---</div>
                        <div class="patient-name">请等待</div>
                    </div>
                </div>

                <div class="call-label">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                    </svg>
                    正在呼叫
                </div>
            </div>
        </section>

        <!-- 底部提示 -->
        <footer class="tips">
            <div class="tip-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
                <span>注意叫号</span>
            </div>
            <div class="tip-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>
                </svg>
                <span>保持安静</span>
            </div>
            <div class="tip-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <span>保管财物</span>
            </div>
        </footer>
    </div>

    <script src="business.js"></script>

    <!-- 全屏控制脚本 -->
    <script>
        (function() {
            const fullscreenBtn = document.getElementById('fullscreenBtn');

            function enterFullScreen() {
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
            }

            function exitFullScreen() {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }

            function toggleFullScreen() {
                if (document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement) {
                    exitFullScreen();
                } else {
                    enterFullScreen();
                }
            }

            function updateButtonText() {
                const isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
                fullscreenBtn.textContent = isFullscreen ? '退出' : '全屏';
            }

            document.addEventListener('fullscreenchange', updateButtonText);
            document.addEventListener('webkitfullscreenchange', updateButtonText);
            document.addEventListener('msfullscreenchange', updateButtonText);

            fullscreenBtn.addEventListener('click', toggleFullScreen);
            updateButtonText();
        })();
    </script>

</body>
</html>
