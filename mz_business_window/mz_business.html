<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>患者展示 - 排队叫号系统</title>
    <style>
/* ========================================
   患者展示 - 排队叫号系统
   竖屏版 - 简洁大气 叫号信息突出
   ======================================== */

*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --primary: #3B82F6;
    --primary-dark: #2563EB;
    --bg-page: #F8FAFC;
    --bg-card: #FFFFFF;
    --border: #E2E8F0;
    --text-primary: #1E293B;
    --text-secondary: #64748B;
}

html, body {
    height: 100%;
    overflow: hidden;
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 50%, #1E40AF 100%);
    color: white;
    line-height: 1.6;
    height: 100vh;
}

/* 主容器 */
.container {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 100%;
    padding: 0;
}

/* 顶部导航 */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    z-index: 10;
    flex-shrink: 0;
}

.hospital-logo {
    width: 48px;
    height: 48px;
    background: rgba(255,255,255,0.2);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
}

.hospital-logo svg {
    width: 28px;
    height: 28px;
}

.header-title {
    text-align: center;
    flex: 1;
    padding: 0 16px;
}

.header-title h1 {
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: 2px;
}

.header-title .subtitle {
    font-size: 0.8rem;
    opacity: 0.8;
    margin-top: 2px;
}

.window-info {
    display: flex;
    align-items: center;
    gap: 8px;
}

.window-info svg {
    width: 20px;
    height: 20px;
    opacity: 0.9;
}

.window-info select {
    padding: 8px 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 8px;
    font-size: 0.9rem;
    font-family: inherit;
    background: rgba(255,255,255,0.15);
    color: white;
    cursor: pointer;
    backdrop-filter: blur(4px);
}

.window-info select:focus {
    outline: none;
    border-color: rgba(255,255,255,0.6);
}

.window-info select option {
    background: var(--primary-dark);
    color: white;
}

/* 全屏按钮 */
.fullscreen-btn {
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.4);
    color: white;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: 0.3s;
}

.fullscreen-btn:hover {
    background: rgba(255,255,255,0.3);
}

/* 当前叫号大屏 - 核心区域 */
.current-call-display {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
}

/* 背景装饰 */
.current-call-display::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 50%);
    animation: shimmer 6s linear infinite;
}

@keyframes shimmer {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.call-content {
    position: relative;
    z-index: 1;
    width: 100%;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* 正在呼叫标签 */
.call-label {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 1.1rem;
    opacity: 0.9;
    margin-bottom: 24px;
    background: rgba(255,255,255,0.15);
    padding: 18px 35px;
    border-radius: 30px;
    border: 1px solid rgba(255,255,255,0.2);
}

.call-label svg {
    width: 24px;
    height: 24px;
}

/* 叫号号码 - 核心焦点 */
.call-number {
    font-size: 10rem;
    font-weight: 800;
    letter-spacing: 8px;
    line-height: 1;
    margin-bottom: 16px;
    text-shadow: 0 8px 32px rgba(0,0,0,0.3);
    position: relative;
}

/* 号码装饰 */
.call-number::after {
    content: '号';
    position: absolute;
    right: -60px;
    bottom: 20px;
    font-size: 2rem;
    font-weight: 400;
    opacity: 0.7;
}

/* 患者姓名 */
.patient-name {
    font-size: 20rem;
    opacity: 0.95;
    margin-bottom: 32px;
    font-weight: 500;
    letter-spacing: 4px;
}

.patient-name::after {
    content: '号';
    position: absolute;
    right: -60px;
    bottom: 20px;
    font-size: 2rem;
    font-weight: 400;
    opacity: 0.7;
}

/* 窗口信息 */
.window-badge {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: rgba(255,255,255,0.2);
    padding: 32px 72px;
    border-radius: 20px;
    font-size: 2.5rem;
    font-weight: 500;
    border: 1px solid rgba(255,255,255,0.25);
    margin-bottom: 24px;
}

.window-badge svg {
    width: 48px;
    height: 48px;
}

/* 底部提示 */
.tips {
    display: flex;
    justify-content: center;
    gap: 60px;
    padding: 44px;      /* 上下内边距，控制整体高度 */
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    flex-shrink: 0;
}

.tip-item {
    display: flex;
    align-items: center;
    gap: 10px;
    opacity: 0.85;
    font-size: 1.5rem;
}

.tip-item svg {
    width: 24px;
    height: 24px;
}

/* 叫号动画 */
@keyframes callPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.02); }
}

.calling-animation {
    animation: callPulse 1.5s ease-in-out 4;
}

/* 响应式调整 */
@media (max-height: 700px) {
    .call-number {
        font-size: clamp(6rem, 30vw, 12rem);
    }

    .patient-name {
        font-size: clamp(2rem, 8vw, 3.5rem);
        margin-bottom: 20px;
    }

    .call-label {
        margin-bottom: 16px;
    }
}

@media (max-height: 550px) {
    .call-number::after {
        display: none;
    }

    .tips {
        gap: 40px;
        padding: 16px;
    }
}

@media (max-width: 400px) {
    .header {
        padding: 12px 16px;
    }

    .hospital-logo {
        width: 40px;
        height: 40px;
    }

    .header-title h1 {
        font-size: 1.1rem;
    }

    .call-label {
        font-size: 0.95rem;
        padding: 10px 22px;
    }

    .window-badge {
        font-size: 1.1rem;
        padding: 12px 28px;
    }

    .tips {
        gap: 30px;
    }

    .tip-item {
        font-size: 0.9rem;
    }
}
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部导航 -->
        <header class="header">
            <div class="hospital-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                </svg>
            </div>
            <div class="header-title">
                <h1 id="systemTitle">排队叫号系统</h1>
                <span class="subtitle">请留意屏幕显示</span>
            </div>
            <div class="window-info">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                    <circle cx="12" cy="10" r="3"/>
                </svg>
                <select id="windowSelect">
                    <option value="">加载中...</option>
                </select>
                <button id="fullscreenBtn" class="fullscreen-btn">全屏</button>
            </div>
        </header>

        <!-- 当前叫号大屏 -->
        <section class="current-call-display">
            <div class="call-content">
                <div class="window-badge" id="windowBadge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                        <circle cx="12" cy="10" r="3"/>
                    </svg>
                    <span id="windowName">窗口1</span>
                </div>

                <div class="call-number" id="callNumber">---</div>
                <div class="patient-name" id="patientName">请等待</div>

                <div class="call-label">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                    </svg>
                    正在呼叫
                </div>
            </div>
        </section>

        <!-- 底部提示 -->
        <footer class="tips">
            <div class="tip-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
                <span>注意叫号</span>
            </div>
            <div class="tip-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>
                </svg>
                <span>保持安静</span>
            </div>
            <div class="tip-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <span>保管财物</span>
            </div>
        </footer>
    </div>

    <script src="business.js"></script>

    <!-- 全屏控制脚本 -->
    <script>
        (function() {
            const fullscreenBtn = document.getElementById('fullscreenBtn');

            function enterFullScreen() {
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
            }

            function exitFullScreen() {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }

            function toggleFullScreen() {
                if (document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement) {
                    exitFullScreen();
                } else {
                    enterFullScreen();
                }
            }

            function updateButtonText() {
                const isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
                fullscreenBtn.textContent = isFullscreen ? '退出' : '全屏';
            }

            document.addEventListener('fullscreenchange', updateButtonText);
            document.addEventListener('webkitfullscreenchange', updateButtonText);
            document.addEventListener('msfullscreenchange', updateButtonText);

            fullscreenBtn.addEventListener('click', toggleFullScreen);
            updateButtonText();
        })();
    </script>
</body>
</html>
